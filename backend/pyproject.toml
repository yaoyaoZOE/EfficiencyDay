[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "efficiencyday-backend"
version = "0.1.0"
description = "EfficiencyDay API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.1,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
