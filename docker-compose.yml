services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      EFFICIENCYDAY_DATABASE_PATH: /app/data/efficiencyday.db
      EFFICIENCYDAY_INITIAL_USERNAME: ${EFFICIENCYDAY_INITIAL_USERNAME:-}
      EFFICIENCYDAY_INITIAL_PASSWORD: ${EFFICIENCYDAY_INITIAL_PASSWORD:-}
      EFFICIENCYDAY_PUBLIC_ORIGIN: ${EFFICIENCYDAY_PUBLIC_ORIGIN:-}
      EFFICIENCYDAY_SESSION_TTL_DAYS: ${EFFICIENCYDAY_SESSION_TTL_DAYS:-7}
      EFFICIENCYDAY_SESSION_COOKIE_SECURE: "${EFFICIENCYDAY_SESSION_COOKIE_SECURE:-true}"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6931/api/v1/health/ready', timeout=3).close()"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${EFFICIENCYDAY_BIND_ADDRESS:-127.0.0.1}:${EFFICIENCYDAY_PORT:-8327}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  backend-data:
